<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js" defer></script>
    <style>
        .inputs {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .resultcont {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            font-size: 20px;
        }

        #firstInput {}

        p[style*="red"] {
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="inputs">
        <div>
            <input id="firstInput" type="text">
            <p id="firstInputError" style="color: red;"></p>
        </div>
        <div>
            <input id="secondInput" type="text">
            <p id="secondInputError" style="color: red;"></p>
        </div>
        <div>
            <input id="thirdInput" type="text">
            <p id="thirdInputError" style="color: red;"></p>
        </div>
    </div>

    <button id="button">Расчитать</button>

    <div class="resultcont">
        <p>Результат: </p>
        <p class="result" style="font-weight: bold; color: blue;"></p>
    </div>
</body>

</html>
