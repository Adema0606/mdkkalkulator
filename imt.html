<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор ИМТ</title>
    <script src="imt.js" defer></script>
    <style>
        .inputs {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .resultcont {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
            font-size: 20px;
        }

        .result-item {
            display: flex;
            gap: 10px;
        }

        p[style*="red"] {
            font-size: 12px;
            margin-top: 5px;
            height: 15px;
        }
    </style>
</head>

<body>
    <div class="inputs">
        <div>
            <label for="weightInput">Вес (кг):</label><br>
            <input id="weightInput" type="text">
            <p id="weightInputError" style="color: red; margin: 0;"></p>
        </div>
        <div>
            <label for="heightInput">Рост (см):</label><br>
            <input id="heightInput" type="text">
            <p id="heightInputError" style="color: red; margin: 0;"></p>
        </div>
    </div>

    <button id="button">Рассчитать ИМТ</button>

    <div class="resultcont">
        <div class="result-item">
            <p>Ваш ИМТ: </p>
            <p class="result" style="font-weight: bold; color: blue;"></p>
        </div>
        <div class="result-item">
            <p>Вердикт: </p>
            <p class="status" style="font-weight: bold;"></p>
        </div>
    </div>
</body>

</html>
